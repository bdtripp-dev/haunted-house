services:
  haunted-house: # Other services could be db, api, or app
    image: bdtrippdev/haunted-house:${TAG}
    restart: always
    labels:
      - "deunhealth.restart=true"
    environment:
      - VIRTUAL_HOST=${FQDN}
      - ENV_NAME=${ENV_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - public_net
networks:
  public_net:
    name: ${ENV_NAME}_public
    external: true
    